[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msgbranch"
version = "1.0.0"
description = "Evidence-driven qualification of localized message boundaries"
requires-python = ">=3.12,<3.14"
dependencies = ["Babel==2.18.0", "attrs==26.1.0", "pytz==2026.2", "Jinja2==3.1.6"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]
jupyter = ["jupyter_server==2.17.0"]

[project.scripts]
msgbranch = "msgbranch.cli:main"
msgbranch-project = "msgbranch.project:main"

[tool.pytest.ini_options]
pythonpath = [".", "src", "vendor/python-fluent"]
testpaths = ["tests"]
